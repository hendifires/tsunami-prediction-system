# Experiments matrix for stacking_pipeline

global:
  cv: 3
  random_state: 42
  with_xgb: true
  with_mlp: false
  feature_select: "none"   # none | pearson | rfe
  top_n: 30
  meta_grid: true
  fast: false              # true untuk debug cepat
  fast_n: 5000
  collect_outputs: true    # salin keluaran ke folder run

# Opsional: jalankan tiap run dengan multi-seed (akan override global.random_state)
seeds: [42]

runs:
  - name: auto_best
    datasets: ["tectonic", "volcanic"]
    use_smote: "auto"     # auto|yes|no
    ablation: false

  - name: ablation_full
    datasets: ["tectonic", "volcanic"]
    ablation: true        # akan jalankan nosmote + smote + smote_tomek + smote_enn

  # Contoh run spesifik
  - name: volcanic_nosmote_only
    datasets: ["volcanic"]
    use_smote: "no"
    ablation: false

  - name: volcanic_smote_only
    datasets: ["volcanic"]
    use_smote: "yes"
    ablation: false