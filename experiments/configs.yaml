# Experiments matrix for stacking_pipeline
# Versi tesis: tanpa XGBoost, fokus pada base learner klasik
# (Decision Tree, Random Forest, MLP, SVM, Naive Bayes, KNN)

global:
  cv: 3
  random_state: 42

  # XGBoost dimatikan: stacking_pipeline sudah tidak memakai XGB
  # agar fokus pada peningkatan kinerja base learner klasik.
  with_xgb: false

  # MLP diaktifkan sebagai salah satu base learner
  # (bisa dimatikan jika ingin eksperimen tanpa neural network).
  with_mlp: true

  # Pemilihan fitur: "none" | "pearson" | "rfe"
  feature_select: "none"
  top_n: 30

  # Grid search untuk meta-learner (Logistic Regression)
  meta_grid: true

  # true untuk debug cepat (subsample train)
  fast: false
  fast_n: 5000

  # Disiapkan kalau nanti mau dipakai untuk salin output ke folder khusus
  collect_outputs: true

# Opsional: jalankan tiap run dengan multi-seed (override global.random_state)
# Bisa diubah misalnya menjadi [42, 1337]
seeds: [42]

runs:
  # Run otomatis: pilih SMOTE jika file train_smote tersedia, per dataset
  - name: auto_best
    datasets: ["tectonic", "volcanic"]
    use_smote: "auto"     # auto | yes | no
    ablation: false

  # Ablation penuh: nosmote + smote + smote_tomek + smote_enn
  - name: ablation_full
    datasets: ["tectonic", "volcanic"]
    use_smote: "auto"
    ablation: true        # akan jalankan semua varian SMOTE

  # Contoh run spesifik volcanic (tanpa SMOTE)
  - name: volcanic_nosmote_only
    datasets: ["volcanic"]
    use_smote: "no"
    ablation: false

  # Contoh run spesifik volcanic (hanya SMOTE standar)
  - name: volcanic_smote_only
    datasets: ["volcanic"]
    use_smote: "yes"
    ablation: false

# Langkah-langkah pipeline yang dijalankan oleh run_experiment.py
steps:
  preproc: true  # jalankan preprocessing
  fe: true       # jalankan feature_engineering
  smote: true    # jalankan smote_pipeline
  stack: true    # jalankan stacking_pipeline

# Path tambahan (dipakai feature_engineering untuk jarak ke garis pantai)
paths:
  coastline: "data/coastline/ne_10m_coastline.shp"