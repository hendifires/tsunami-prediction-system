<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tsunami Prediction</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background:#f4f8fb;
      margin:0;
      min-height:100vh;
    }
    .container {
      background:#fff;
      max-width:520px;
      margin:40px auto 0;
      border-radius:16px;
      box-shadow:0 4px 16px rgba(40,80,120,.12);
      padding:32px 28px 24px;
    }
    h1 {
      text-align:center;
      color:#1a3a5d;
      margin-top:0;
      margin-bottom:4px;
    }
    .subtitle {
      text-align:center;
      font-size:0.88rem;
      color:#5c6f86;
      margin:0 0 24px;
      line-height:1.35;
    }
    .subtitle span.tag {
      display:inline-block;
      padding:2px 7px;
      border-radius:999px;
      background:#edf4ff;
      border:1px solid #d1ddf5;
      font-size:0.8rem;
      margin:2px 3px;
    }
    form > div {
      margin-bottom:16px;
    }
    label {
      display:block;
      margin-bottom:6px;
      font-weight:600;
      color:#1a3a5d;
      font-size:0.95rem;
    }
    input {
      width:100%;
      padding:8px 10px;
      border:1px solid #b6c5dd;
      border-radius:7px;
      font-size:1rem;
      background:#fafdff;
    }
    input:focus {
      outline:none;
      border-color:#2e72c5;
      box-shadow:0 0 0 1px rgba(46,114,197,.25);
    }
    button[type="submit"] {
      width:100%;
      padding:12px;
      border-radius:10px;
      background:linear-gradient(90deg,#2e72c5,#3db0b6);
      color:#fff;
      font-weight:bold;
      border:none;
      font-size:1.05rem;
      margin-top:6px;
      cursor:pointer;
    }
    button[type="submit"]:hover {
      opacity:0.95;
    }
    #result {
      margin-top:22px;
      font-size:0.98rem;
      color:#244a65;
      padding:15px 14px;
      background:#e6f3f8;
      border-radius:7px;
      min-height:22px;
      border:1px solid #bee2f0;
    }
    #result b {
      color:#17344b;
    }
    .probs {
      margin-top:8px;
      font-family: Consolas, Menlo, monospace;
      font-size:0.9rem;
      line-height:1.4;
    }
    .meta {
      margin-top:8px;
      font-size:0.85rem;
      color:#556b82;
    }
    @media (max-width:600px) {
      .container{
        padding:20px 10px 14px;
        max-width:98vw;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Tsunami Prediction</h1>
    <p class="subtitle">
      <span class="tag">Class 0: Non-tsunami</span>
      <span class="tag">Class 1: Tsunami Tektonik</span>
      <span class="tag">Class 2: Tsunami Vulkanik</span><br/>
      Model: <b>Stacking Ensemble + SMOTE</b>
      (artifact: <code>events_smote_stacking.joblib</code>)
    </p>

    <form id="prediction-form">
      <div>
        <label for="mag">Magnitude (Mw):</label>
        <input type="number" step="0.01" id="mag" required>
      </div>
      <div>
        <label for="depth">Focal Depth (km):</label>
        <input type="number" step="0.01" id="depth" required>
      </div>
      <div>
        <label for="lat">Latitude (°):</label>
        <input type="number" step="0.0001" id="lat" required>
      </div>
      <div>
        <label for="lon">Longitude (°):</label>
        <input type="number" step="0.0001" id="lon" required>
      </div>
      <div>
        <label for="vei">VEI (0–8, gunakan 0 untuk non-vulkanik):</label>
        <input type="number" step="1" min="0" max="8" id="vei" required>
      </div>
      <div>
        <label for="elev">Elevation (m, 0 jika di laut):</label>
        <input type="number" step="1" id="elev" required>
      </div>

      <button type="submit">Predict</button>
    </form>

    <div id="result">Silakan masukkan parameter kejadian, lalu tekan <b>Predict</b>.</div>
  </div>

  <script>
    function mapClassLabel(c) {
      if (c === 1) return "Tsunami Tektonik (class=1)";
      if (c === 2) return "Tsunami Vulkanik (class=2)";
      return "Non-tsunami (class=0)";
    }

    document.getElementById("prediction-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = "Predicting…";

      const payload = {
        datas: [{
          mag: +document.getElementById("mag").value,
          depth: +document.getElementById("depth").value,
          latitude: +document.getElementById("lat").value,
          longitude: +document.getElementById("lon").value,
          vei: +document.getElementById("vei").value,
          elevation: +document.getElementById("elev").value
        }]
      };

      try {
        const r = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const j = await r.json();
        if (!r.ok) {
          resultDiv.innerHTML =
            `<span style="color:red;">Error: ${j.detail || JSON.stringify(j)}</span>`;
          return;
        }

        if (!Array.isArray(j.predictions) || j.predictions.length === 0) {
          resultDiv.innerHTML = `<span style="color:red;">Error: invalid response</span>`;
          return;
        }

        const cls = j.predictions[0];
        const probs = (j.probabilities && j.probabilities[0])
          ? j.probabilities[0]
          : null;

        let html = `<b>Predicted Class:</b> ${mapClassLabel(cls)}<br/>`;

        if (probs && probs.length === 3) {
          html += `<div class="probs">
P(Non-tsunami)      : ${(probs[0]*100).toFixed(1)}%<br/>
P(Tsunami Tektonik) : ${(probs[1]*100).toFixed(1)}%<br/>
P(Tsunami Vulkanik) : ${(probs[2]*100).toFixed(1)}%
</div>`;
        }

        const thr = typeof j.threshold === "number" ? j.threshold.toFixed(3) : null;
        const modelName = j.model_name || null;
        const smoteVariant = j.smote_variant || null;
        const artifact = j.artifact || null;

        if (thr || modelName || smoteVariant || artifact) {
          const parts = [];
          if (modelName) parts.push(`model=${modelName}`);
          if (smoteVariant) parts.push(`smote=${smoteVariant}`);
          if (thr) parts.push(`thr=${thr}`);
          if (artifact) parts.push(`artifact=${artifact}`);
          html += `<div class="meta"><b>Model info:</b> ${parts.join(" | ")}</div>`;
        }

        resultDiv.innerHTML = html;
      } catch (err) {
        resultDiv.innerHTML =
          `<span style="color:red;">Error: ${err.message}</span>`;
      }
    });
  </script>
</body>
</html>
