<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tsunami Prediction</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background:#f4f8fb; margin:0; min-height:100vh; }
    .container { background:#fff; max-width:500px; margin:40px auto 0; border-radius:16px;
      box-shadow:0 4px 16px rgba(40,80,120,.12); padding:32px 28px 24px; }
    h1 { text-align:center; color:#1a3a5d; margin-top:0; }
    .tabs { text-align:center; margin-bottom:28px; }
    .tab-btn { padding:9px 28px; margin-right:10px; border-radius:24px; border:none;
      background:#e0eaf4; color:#1a3a5d; font-weight:600; cursor:pointer; font-size:1rem; }
    .tab-btn.active { background:#2e72c5; color:#fff; }
    form>div { margin-bottom:18px; }
    label { display:block; margin-bottom:6px; font-weight:bold; color:#1a3a5d; }
    input,select { width:100%; padding:8px 10px; border:1px solid #b6c5dd; border-radius:7px;
      font-size:1rem; background:#fafdff; }
    input:focus,select:focus { outline:none; border-color:#2e72c5; }
    button[type="submit"] { width:100%; padding:12px; border-radius:10px;
      background:linear-gradient(90deg,#2e72c5,#3db0b6); color:#fff; font-weight:bold; border:none; font-size:1.1rem; margin-top:10px; cursor:pointer; }
    .hidden { display:none; }
    #result { margin-top:28px; font-size:1.11rem; color:#244a65; padding:15px; background:#e6f3f8;
      border-radius:7px; min-height:22px; text-align:center; border:1px solid #bee2f0; }
    @media (max-width:600px){ .container{ padding:18px 7px 12px; max-width:98vw; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>Tsunami Prediction</h1>
    <div class="tabs">
      <button id="btn-tec" class="tab-btn active" onclick="showForm('tec')">Tectonic Earthquake</button>
      <button id="btn-vul" class="tab-btn" onclick="showForm('vul')">Volcanic Activity</button>
    </div>

    <!-- Tectonic -->
    <form id="form-tec">
      <div><label for="mag">Magnitude (Mag):</label><input type="number" step="0.01" id="mag" required></div>
      <div><label for="depth">Focal Depth (km):</label><input type="number" step="0.01" id="depth" required></div>
      <div><label for="latitude_tec">Latitude:</label><input type="number" step="0.0001" id="latitude_tec" required></div>
      <div><label for="longitude_tec">Longitude:</label><input type="number" step="0.0001" id="longitude_tec" required></div>
      <div><label for="country_tec">Country:</label><select id="country_tec" required></select></div>
      <div><label for="is_subduction_zone">Subduction Zone:</label>
        <select id="is_subduction_zone" required><option value="">--Select--</option><option value="1">Yes</option><option value="0">No</option></select>
      </div>
      <div><label for="distance_to_coast_km">Distance to Coast (km):</label><input type="number" step="0.01" id="distance_to_coast_km" required></div>
      <button type="submit">Predict</button>
    </form>

    <!-- Volcanic -->
    <form id="form-vul" class="hidden">
      <div><label for="eq">Earthquake Magnitude (Eq):</label><input type="number" step="0.01" id="eq" required></div>
      <div><label for="elevation">Elevation (m):</label><input type="number" step="1" id="elevation" required></div>
      <div><label for="latitude_vul">Latitude:</label><input type="number" step="0.0001" id="latitude_vul" required></div>
      <div><label for="longitude_vul">Longitude:</label><input type="number" step="0.0001" id="longitude_vul" required></div>
      <div><label for="country_vul">Country:</label><select id="country_vul" required></select></div>
      <div><label for="type">Volcano Type:</label>
        <select id="type" required>
          <option value="">--Select Type--</option>
          <option>Caldera</option><option>Stratovolcano</option><option>Complex volcano</option>
          <option>Shield volcano</option><option>Pyroclastic shield</option><option>Volcanic field</option>
          <option>Lava dome</option><option>Subglacial volcano</option><option>Crater rows</option>
          <option>Tuff cone</option><option>Fissure vent</option><option>Pyroclastic cone</option>
          <option>Submarine volcano</option><option>Lava cone</option><option>Pumice cone</option>
          <option>Mud volcano</option><option>Submarine volcanoes</option><option>Cinder cone</option>
          <option>Compound volcano</option><option>Maar</option>
        </select>
      </div>
      <div><label for="vei">VEI:</label><input type="number" step="1" id="vei" required></div>
      <div><label for="distance_to_coast_km_vul">Distance to Coast (km):</label><input type="number" step="0.01" id="distance_to_coast_km_vul" required></div>
      <div><label for="is_subduction_zone_vul">Subduction Zone:</label>
        <select id="is_subduction_zone_vul" required><option value="">--Select--</option><option value="1">Yes</option><option value="0">No</option></select>
      </div>
      <button type="submit">Predict</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    const countries = ["Afghanistan","Albania","Algeria","Andorra","Angola","Argentina","Armenia","Australia","Austria","Azerbaijan","Bahamas","Bahrain","Bangladesh","Barbados","Belarus","Belgium","Belize","Benin","Bhutan","Bolivia","Bosnia and Herzegovina","Botswana","Brazil","Brunei","Bulgaria","Burkina Faso","Burundi","Cambodia","Cameroon","Canada","Cape Verde","Central African Republic","Chad","Chile","China","Colombia","Comoros","Congo","Costa Rica","Croatia","Cuba","Cyprus","Czech Republic","Denmark","Djibouti","Dominica","Dominican Republic","Ecuador","Egypt","El Salvador","Equatorial Guinea","Eritrea","Estonia","Eswatini","Ethiopia","Fiji","Finland","France","Gabon","Gambia","Georgia","Germany","Ghana","Greece","Guatemala","Guinea","Guinea-Bissau","Guyana","Haiti","Honduras","Hungary","Iceland","India","Indonesia","Iran","Iraq","Ireland","Israel","Italy","Jamaica","Japan","Jordan","Kazakhstan","Kenya","Kiribati","Kuwait","Kyrgyzstan","Laos","Latvia","Lebanon","Lesotho","Liberia","Libya","Lithuania","Luxembourg","Madagascar","Malawi","Malaysia","Maldives","Mali","Malta","Marshall Islands","Mauritania","Mauritius","Mexico","Micronesia","Moldova","Monaco","Mongolia","Montenegro","Morocco","Mozambique","Myanmar","Namibia","Nepal","Netherlands","New Zealand","Nicaragua","Niger","Nigeria","North Korea","North Macedonia","Norway","Oman","Pakistan","Palau","Panama","Papua New Guinea","Paraguay","Peru","Philippines","Poland","Portugal","Qatar","Romania","Russia","Rwanda","Saint Kitts and Nevis","Saint Lucia","Saint Vincent and the Grenadines","Samoa","San Marino","Sao Tome and Principe","Saudi Arabia","Senegal","Serbia","Seychelles","Sierra Leone","Singapore","Slovakia","Slovenia","Solomon Islands","Somalia","South Africa","South Korea","South Sudan","Spain","Sri Lanka","Sudan","Suriname","Sweden","Switzerland","Syria","Tajikistan","Tanzania","Thailand","Togo","Tonga","Trinidad and Tobago","Tunisia","Turkey","Turkmenistan","Tuvalu","Uganda","Ukraine","United Arab Emirates","United Kingdom","United States","Uruguay","Uzbekistan","Vanuatu","Vatican City","Venezuela","Vietnam","Yemen","Zambia","Zimbabwe"];
    function fillCountry(id){ const sel=document.getElementById(id); sel.innerHTML='<option value="">--Select Country--</option>'; countries.forEach(c=>{const o=document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o);});}
    fillCountry("country_tec"); fillCountry("country_vul");

    function showForm(name){
      document.getElementById("result").textContent="";
      document.getElementById("btn-tec").classList.remove("active");
      document.getElementById("btn-vul").classList.remove("active");
      const tec=name==="tec"; document.getElementById("form-tec").classList.toggle("hidden",!tec);
      document.getElementById("form-vul").classList.toggle("hidden",tec);
      document.getElementById(tec?"btn-tec":"btn-vul").classList.add("active");
    }

    document.getElementById("form-tec").addEventListener("submit", async (e)=>{
      e.preventDefault();
      const payload = { datas: [{
        mag:+mag.value, depth:+depth.value, latitude:+latitude_tec.value, longitude:+longitude_tec.value,
        country: country_tec.value, is_subduction_zone:+is_subduction_zone.value, distance_to_coast_km:+distance_to_coast_km.value
      }]};
      try{
        const r = await fetch("/v1/predict/tectonic",{method:"POST", headers:{ "Content-Type":"application/json"}, body:JSON.stringify(payload)});
        const j = await r.json();
        result.innerHTML = j.predictions ? `<b>Prediction (Tectonic):</b> ${j.predictions[0]===1?"Tsunamigenic":"Non-Tsunamigenic"}<br><b>Probability:</b> ${(j.probabilities[0]*100).toFixed(1)} %` : `<span style="color:red;">Error: ${JSON.stringify(j)}</span>`;
      }catch(err){ result.innerHTML = `<span style="color:red;">Error: ${err.message}</span>`; }
    });

    document.getElementById("form-vul").addEventListener("submit", async (e)=>{
      e.preventDefault();
      const payload = { datas: [{
        eq:+eq.value, elevation:+elevation.value, latitude:+latitude_vul.value, longitude:+longitude_vul.value,
        country: country_vul.value, type: type.value, vei:+vei.value,
        distance_to_coast_km:+distance_to_coast_km_vul.value, is_subduction_zone:+is_subduction_zone_vul.value
      }]};
      try{
        const r = await fetch("/v1/predict/volcanic",{method:"POST", headers:{ "Content-Type":"application/json"}, body:JSON.stringify(payload)});
        const j = await r.json();
        result.innerHTML = j.predictions ? `<b>Prediction (Volcanic):</b> ${j.predictions[0]===1?"Tsunamigenic":"Non-Tsunamigenic"}<br><b>Probability:</b> ${(j.probabilities[0]*100).toFixed(1)} %` : `<span style="color:red;">Error: ${JSON.stringify(j)}</span>`;
      }catch(err){ result.innerHTML = `<span style="color:red;">Error: ${err.message}</span>`; }
    });

    showForm("tec");
  </script>
</body>
</html>
