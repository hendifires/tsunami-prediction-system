[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsunami-prediction"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.25",
  "scikit-learn>=1.3",
  "imbalanced-learn>=0.12",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "scipy>=1.11",
  "joblib>=1.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]